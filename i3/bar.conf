# Colors
set $background #000000
set $statusline #eeeeee
set $separator #666666

bar {
    status_command i3blocks
    font pango:DejaVu Sans Mono 10

    # workspace_buttons yes|no
    workspace_buttons yes

    # tray_output none|primary|<output>
    tray_output primary

    # mode dock|hide|invisible
    mode dock

    # hidden_state hide|show
    hidden_state show
    # modifier <Modifier>|none
    modifier none

    # position top|bottom
    position top

    colors {
        background $background
        statusline $statusline
        separator $separator

        focused_workspace   $border_color  $focused_color  $focused_text
        active_workspace    $border_color  $active_color   $active_text
        inactive_workspace  $border_color  $inactive_color $inactive_text
        urgent_workspace    $border_color  $urgent_color   $urgent_text
        binding_mode        $binding_color $binding_color  $urgent_text
    }
}
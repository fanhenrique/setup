# Special keys to adjust volume via PulseAudio

# Volume control
bindsym --locked $mod+XF86AudioMute exec pactl set-sink-mute \@DEFAULT_SINK@ toggle
bindsym --locked $mod+XF86AudioRaiseVolume exec pactl set-sink-volume \@DEFAULT_SINK@ +5%
bindsym --locked $mod+XF86AudioLowerVolume exec pactl set-sink-volume \@DEFAULT_SINK@ -5%

# Microphone control
bindsym --locked $mod+XF86AudioMicMute exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle
bindsym --locked $mod+XF86Launch5 exec pactl set-source-volume \@DEFAULT_SOURCE@ +5%
bindsym --locked $mod+XF86Launch6 exec pactl set-source-volume \@DEFAULT_SOURCE@ -5%
